services:
  api:
    container_name: 'lampstand-api'
    build:
      dockerfile: Dockerfile
      context: .
      target: base
    depends_on:
      - postgres
    env_file:
      - .env
    expose:
      - ${PORT}
    ports:
      - ${PORT}:${PORT}
    volumes:
      - ./src:/app/src
      - ./nodemon.json:/app/nodemon.json
      - ./logs:/app/logs
    command: npm run dev
  postgres:
    container_name: 'lampstand-postgres'
    image: 'postgres:13'
    restart: always
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    env_file:
      - .env
    volumes:
      - ./data:/var/lib/postgresql/data
