version: '3.7'
services:
  api:
    container_name: 'api'
    build:
      dockerfile: Dockerfile
      context: .
      target: base
    depends_on:
      - postgres
    env_file:
      - .env
    expose:
      - ${PORT}
    ports:
      - ${PORT}:${PORT}
    volumes:
      - ./src:/app/src
      - ./nodemon.json:/app/nodemon.json
    command: npm run dev
  postgres:
    container_name: postgres
    image: 'postgres:13'
    restart: always
    ports:
      - ${POSTGRES_PORT}:5432
    env_file:
      - .env
    volumes:
      - ./data:/var/lib/postgresql/data
